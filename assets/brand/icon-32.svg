<!-- 32px step of the macOS ramp: radius 7, mark 18, squares 12, stroke 1.5.
     Plate gradient and hairline carry over from icon-macos.svg; only the 16px
     step drops to a flat background. -->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0.281" y1="-0.102" x2="0.719" y2="1.102">
      <stop offset="0" stop-color="#1e232b"/>
      <stop offset="1" stop-color="#12151a"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5"
        fill="url(#plate)" stroke="#2b313b" stroke-width="1"/>
  <rect x="13.75" y="7.75" width="10.5" height="10.5" rx="1"
        fill="none" stroke="#4a5560" stroke-width="1.5"/>
  <rect x="7"     y="13"   width="12"   height="12"   rx="1" fill="#56b6c2"/>
</svg>
