  <circle cx="66" cy="66" r="66" fill="#12151a"/>
  <rect x="55.5" y="35.5" width="41" height="41" rx="4"
        fill="none" stroke="#4a5560" stroke-width="3"/>
  <rect x="34"   y="54"   width="44" height="44" rx="4" fill="#56b6c2"/>
</svg>
