name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: linux-amd64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The webview headers must exist before the wails3 CLI compiles.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS\Bin"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2

      - name: Package
        run: wails3 package

      # Unsigned for now. When APPLE_CERT_P12 / APPLE_CERT_PASSWORD /
      # APPLE_NOTARY_* secrets exist, add codesign + notarytool steps here
      # before the DMG is created.
      #
      # The DMG stages OUTSIDE dist: the staging folder holds an /Applications
      # symlink, and the artefact upload would follow it into the runner's
      # entire Applications directory.
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" dist
          cp -R bin/culler.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname culler -srcfolder "$STAGE" -ov -format UDZO \
            "dist/culler-${GITHUB_REF_NAME}-macos-arm64.dmg"

      # Named the way the DMG is: culler-<tag>-<platform>[-installer].<ext>.
      # Prefixing the packager's own filename instead produced
      # culler-v0.6.0-windows-amd64-culler-amd64-installer.exe, which says
      # culler twice and amd64 twice.
      - name: Collect artefacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          # The NSIS installer if the packager produced one, and the bare exe.
          found=0
          for f in bin/*.exe; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              *installer*) out="culler-${GITHUB_REF_NAME}-windows-amd64-installer.exe" ;;
              *)           out="culler-${GITHUB_REF_NAME}-windows-amd64.exe" ;;
            esac
            cp "$f" "dist/$out"
            found=1
          done
          [ "$found" = 1 ]

      # These carried no version at all — culler.deb from two releases are the
      # same filename in a downloads folder, and nothing in them says which is
      # which.
      - name: Collect artefacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          shopt -s nullglob
          found=0
          for f in bin/*.AppImage bin/*.deb; do
            cp "$f" "dist/culler-${GITHUB_REF_NAME}-linux-amd64.${f##*.}"
            found=1
          done
          [ "$found" = 1 ] # fail if nothing was packaged

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Notes come from merged PR titles — main is PR-only.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
